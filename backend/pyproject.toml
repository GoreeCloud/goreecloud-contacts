[project]
name = "goreecloud-contacts-backend"
version = "0.1.0"
description = "CardDAV API for the GoreeCloud Contacts web application"
requires-python = ">=3.10"
dependencies = [
  "cryptography==49.0.0",
  "fastapi[standard]==0.139.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
