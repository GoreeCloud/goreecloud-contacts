[project]
name = "goreecloud-contacts-backend"
version = "0.1.0"
description = "CardDAV API for the GoreeCloud Contacts web application"
requires-python = ">=3.10"
dependencies = [
  "cryptography==49.0.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.3",
]

[project.optional-dependencies]
dev = [
  "fastapi-cli[standard]==0.0.32",
]
test = [
  "httpx2==2.9.0",
  "pytest>=8.0,<9.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
