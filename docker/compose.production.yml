services:
  goreecloud-contacts:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: goreecloud/contacts:${GOREECLOUD_CONTACTS_IMAGE_TAG:-local}
    container_name: goreecloud-contacts
    restart: unless-stopped
    init: true
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      FRONTEND_ORIGIN: https://contacts.goreecloud.com
      SESSION_COOKIE_SECURE: "true"
      CSRF_ORIGIN_CHECK_ENABLED: "true"
      SESSION_STORE_BACKEND: sqlite
      SESSION_DB_PATH: /data/sessions.sqlite3
      DUPLICATE_MERGE_ENABLED: "false"
    volumes:
      - type: bind
        source: ${GOREECLOUD_CONTACTS_DATA_PATH:-/srv/docker/appdata/goreecloud-contacts}
        target: /data
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    pids_limit: 256
    stop_grace_period: 20s

networks:
  proxy:
    external: true
