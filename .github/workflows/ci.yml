name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: >-
          python -m pip install
          -e ".[test]"
          pip-audit==2.10.1

      - name: Audit backend dependencies
        # Temporary, scope-limited exception:
        # PYSEC-2026-3552 affects cryptography PKCS#7 EnvelopedData decryption APIs.
        # GoreeCloud Contacts uses Fernet/MultiFernet only, and an automated source
        # guard rejects use/import of the affected PKCS#7 decrypt surface. Remove
        # this exception and upgrade cryptography when a fixed stable release is
        # available.
        run: >-
          python -m pip_audit .
          --progress-spinner off
          --ignore-vuln PYSEC-2026-3552

      - name: Validate live helper syntax
        run: >-
          python -m py_compile
          scripts/validate_milestone3_live.py
          scripts/validate_milestone4_live.py
          scripts/validate_milestone4_phase4c_live.py

      - name: Run backend tests
        run: pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
